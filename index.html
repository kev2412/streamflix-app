<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="StreamFlix" />
<link rel="apple-touch-icon" href="https://img.icons8.com/fluency/192/netflix.png" />
<title>StreamFlix</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
    }
    html, body {
        width: 100%;
        height: 100%;
        background: #0b0e14;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
    }
    #app-shell {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
    }

    /* Top Bar mit festem Notch-Schutz */
    #top-header {
        flex-shrink: 0;
        background: #111722;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding-top: max(env(safe-area-inset-top), 20px);
        padding-bottom: 10px;
        padding-left: 16px;
        padding-right: 16px;
    }
    .header-top-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 38px;
        margin-bottom: 8px;
    }
    .header-left {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    #back-btn {
        display: none;
        background: #e50914;
        color: #ffffff;
        border: none;
        padding: 6px 14px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
    }
    #app-title {
        font-size: 20px;
        font-weight: 900;
        color: #e50914;
        letter-spacing: 1.5px;
    }
    #view-counter {
        font-size: 12px;
        color: #94a3b8;
        font-weight: 600;
    }

    /* Suchleiste */
    .search-container {
        position: relative;
        width: 100%;
        display: flex;
        align-items: center;
    }
    .search-symbol {
        position: absolute;
        left: 12px;
        font-size: 15px;
        color: #64748b;
        pointer-events: none;
    }
    #search-input {
        width: 100%;
        height: 38px;
        background: #1a2232;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        padding: 0 14px 0 36px;
        font-size: 14px;
        color: #ffffff;
        outline: none;
        -webkit-appearance: none;
    }
    #search-input::placeholder {
        color: #64748b;
    }

    /* Scroll Area */
    #content-stage {
        flex: 1;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 14px 14px calc(env(safe-area-inset-bottom) + 80px) 14px;
    }
    #view-name {
        font-size: 17px;
        font-weight: 800;
        margin-bottom: 12px;
        color: #f8fafc;
    }
    #grid-content {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
        gap: 10px;
    }

    /* Ordner */
    .folder-card {
        background: #151c28;
        border-radius: 10px;
        padding: 12px;
        min-height: 64px;
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        cursor: pointer;
    }
    .folder-card:active {
        background: #232d40;
    }
    .folder-badge {
        font-size: 18px;
        flex-shrink: 0;
        color: #e50914;
    }
    .folder-name {
        font-size: 13px;
        font-weight: 700;
        color: #ffffff;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    /* Live Sender Zeilen */
    .live-card {
        background: #151c28;
        border-radius: 10px;
        padding: 8px 12px;
        height: 60px;
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        cursor: pointer;
    }
    .live-card:active {
        background: #232d40;
    }
    .live-logo {
        width: 38px;
        height: 38px;
        object-fit: contain;
        background: #090c12;
        border-radius: 6px;
        flex-shrink: 0;
    }
    .live-details {
        flex: 1;
        overflow: hidden;
    }
    .live-name {
        font-size: 13px;
        font-weight: 700;
        color: #ffffff;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .live-sub {
        font-size: 11px;
        color: #94a3b8;
        margin-top: 1px;
    }
    .fav-star-btn {
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        color: #475569;
        flex-shrink: 0;
    }
    .fav-star-btn.is-favorite {
        color: #fbbf24;
    }

    /* Filme & Serien Poster */
    .media-card {
        background: #151c28;
        border-radius: 10px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        border: 1px solid rgba(255, 255, 255, 0.06);
        cursor: pointer;
    }
    .media-card:active {
        opacity: 0.8;
    }
    .media-poster {
        width: 100%;
        aspect-ratio: 2/3;
        object-fit: cover;
        background: #1a2232;
    }
    .media-title {
        padding: 8px;
        font-size: 11px;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    /* Tab Leiste unten */
    #bottom-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: calc(56px + env(safe-area-inset-bottom));
        background: #111722;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        justify-content: space-around;
        align-items: flex-start;
        padding-top: 6px;
        padding-bottom: env(safe-area-inset-bottom);
        z-index: 100;
    }
    .nav-tab {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        font-size: 10px;
        font-weight: 700;
        color: #64748b;
        width: 30%;
        cursor: pointer;
    }
    .nav-tab.active {
        color: #e50914;
    }
    .nav-tab-icon {
        font-size: 18px;
    }

    #ios-player {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000000;
        z-index: 1000;
        display: none;
    }
</style>
</head>
<body>
<video id="ios-player" controls playsinline onwebkitendfullscreen="closePlayer()"></video>

<div id="app-shell">
    <div id="top-header">
        <div class="header-top-row">
            <div class="header-left">
                <button id="back-btn" onclick="handleBack()">&#8249; ZurÃ¼ck</button>
                <div id="app-title">STREAMFLIX</div>
            </div>
            <div id="view-counter">Bereit</div>
        </div>
        <div class="search-container">
            <span class="search-symbol">&#128269;</span>
            <input type="text" id="search-input" placeholder="Suchen..." oninput="onSearchInput(this.value)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
        </div>
    </div>

    <div id="content-stage">
        <div id="view-name">Live TV</div>
        <div id="grid-content"></div>
    </div>

    <div id="bottom-bar">
        <div id="tab-0" class="nav-tab active" onclick="switchTab(0)">
            <div class="nav-tab-icon">&#128250;</div>
            <div>Live TV</div>
        </div>
        <div id="tab-1" class="nav-tab" onclick="switchTab(1)">
            <div class="nav-tab-icon">&#127916;</div>
            <div>Filme</div>
        </div>
        <div id="tab-2" class="nav-tab" onclick="switchTab(2)">
            <div class="nav-tab-icon">&#127871;</div>
            <div>Serien</div>
        </div>
    </div>
</div>

<script src="main.js?v=2"></script>
</body>
</html>
